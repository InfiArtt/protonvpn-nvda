summary = "Aksesibilitas Proton VPN"
description = "Membuat Proton VPN untuk Windows bisa dipakai dengan NVDA: memberi nama pada tombol, opsi, dan tab yang tidak berlabel, membacakan pengaturan beserta status dan penjelasannya, membacakan flyout saat terbuka, dan mengumumkan saat perlindungan Anda berubah. NVDA+Shift+V melaporkan status koneksi."
